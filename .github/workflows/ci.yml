name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/APS.csproj -c Release --nologo

      # Release day is a bad time to discover that publishing is broken, so CI
      # exercises the same single-file publish the release workflow runs. The
      # output is thrown away; only the exit code matters.
      - name: Smoke-test the release publish
        run: >
          dotnet publish src/APS.csproj -c Release -r win-x64 --nologo
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o ${{ runner.temp }}/publish-smoke

      - name: Smoke-test the installer package
        shell: bash
        run: |
          set -euo pipefail
          cp THIRD-PARTY-NOTICES.md "${{ runner.temp }}/publish-smoke/"
          dotnet tool install --tool-path "${{ runner.temp }}/vpk-tools" vpk --version 1.2.0
          "${{ runner.temp }}/vpk-tools/vpk.exe" pack \
            --packId APS-AudioProfileSystem \
            --packTitle "APS — Audio Profile System" \
            --packAuthors TaterOfTheValley \
            --packVersion 0.1.0-alpha \
            --packDir "${{ runner.temp }}/publish-smoke" \
            --mainExe APS.exe \
            --icon src/Assets/aps.ico \
            --runtime win-x64 \
            --noPortable true \
            --releaseNotes RELEASE_NOTES.md \
            --outputDir "${{ runner.temp }}/pack-smoke"
